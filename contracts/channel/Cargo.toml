[package]
name = "aetheris-channel"
version = "0.1.0"
description = "Soroban escrow channels for x402-style API micropayments"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ed25519-dalek = "2.1"

[lints.rust]
unsafe_code = "deny"
